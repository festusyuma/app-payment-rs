[package]
name = "payment"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = { version = "1.10.1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1.127.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4"] }
shared = { git = "https://github.com/festusyuma/app-shared-rs.git", tag = "0.0.000001" }
moka = { version = "0.12.16", features = ["future"] }
